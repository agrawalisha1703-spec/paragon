provider: mock

tests:
  - name: "JSON Invoice with Full Validation"
    prompt: "Generate a JSON invoice with fields: id, total, date"
    assertions:
      - type: "isValidJson"
      
      - type: "contains"
        value: "INV"
        
      - type: "contains"
        value: "2026"
        
      - type: "equals"
        value: "{\"id\": \"INV-001\", \"total\": 99.99, \"date\": \"2026-11-14\"}"
      
  - name: "CSV Data with Regex Patterns"
    prompt: "Generate a CSV row with columns: name, age, city"
    assertions:
      - type: "contains"
        value: "San Francisco"
        
      - type: "regex"
        value: "\\d{2}"
        
      - type: "regex"
        value: "^[A-Z][a-z]+.*"
        
  - name: "Professional Email Subject"
    prompt: "Write a professional email subject for a meeting reminder"
    assertions:
      - type: "contains"
        value: "Reminder"
        
      - type: "contains"
        value: "Team Standup"
        
      - type: "regex"
        value: ".*[0-9]{2}.*AM.*"
        
  - name: "Product Description"
    prompt: "Generate a product description for a laptop"
    assertions:
      - type: "contains"
        value: "16GB"
        
      - type: "contains"
        value: "SSD"
        
      - type: "regex"
        value: ".*[Ii]ntel.*"
